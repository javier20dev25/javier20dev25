name: update-readme

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths: ['README.md', 'scripts/update-readme.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USER: javier20dev25
        run: node scripts/update-readme.mjs
      - name: Commit changes if any
        run: |
          git config user.name "javier20dev25[bot]"
          git config user.email "javier20dev25@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: auto-update profile stats (bot)"
          git push